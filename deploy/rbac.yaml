apiVersion: v1
kind: Namespace
metadata:
  name: unifi-drive-csi
---
# --- Controller (provisioner) RBAC ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unifi-drive-csi-controller
  namespace: unifi-drive-csi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: unifi-drive-csi-provisioner
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Leader election for the provisioner sidecar.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: unifi-drive-csi-provisioner
subjects:
  - kind: ServiceAccount
    name: unifi-drive-csi-controller
    namespace: unifi-drive-csi
roleRef:
  kind: ClusterRole
  name: unifi-drive-csi-provisioner
  apiGroup: rbac.authorization.k8s.io
---
# --- Node (registrar) RBAC ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unifi-drive-csi-node
  namespace: unifi-drive-csi
