# Copy to deploy/secret.yaml (gitignored) and fill in real credentials, then:
#   kubectl apply -f deploy/secret.yaml
# Prefer a dedicated UniFi local admin account with the minimum role that can
# manage UniFi Drive shares — not your personal SSO/cloud account.
apiVersion: v1
kind: Secret
metadata:
  name: unifi-drive-credentials
  namespace: unifi-drive-csi
type: Opaque
stringData:
  host: "https://10.0.0.10"
  username: "csi-provisioner"
  password: "change-me"
  # TLS verification toggle for the controller's UniFi API calls. UNAS ships a
  # self-signed certificate, so "true" (skip verification) is the pragmatic
  # default for a fresh appliance; set "false" once it presents a trusted cert.
  insecure: "true"
