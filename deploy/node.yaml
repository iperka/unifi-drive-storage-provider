apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: unifi-drive-csi-node
  namespace: unifi-drive-csi
spec:
  selector:
    matchLabels:
      app: unifi-drive-csi-node
  template:
    metadata:
      labels:
        app: unifi-drive-csi-node
    spec:
      serviceAccountName: unifi-drive-csi-node
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        # Registers the driver's unix socket with kubelet.
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.17.0
          args:
            - --csi-address=$(ADDRESS)
            - --kubelet-registration-path=$(REGISTRATION_PATH)
            - --v=2
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: REGISTRATION_PATH
              value: /var/lib/kubelet/plugins/drive.unifi.iperka.com/csi.sock
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        # Liveness: probes the node driver's CSI Identity.Probe and exposes /healthz.
        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.15.0
          args:
            - --csi-address=/csi/csi.sock
            - --health-port=9808
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        # Our driver in node mode: performs the NFS mount + permission fixup.
        - name: unifi-drive-csi
          image: ghcr.io/iperka/unifi-drive-csi:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            # Mounting and chown/chmod require privileges + the host mount ns.
            privileged: true
          args:
            - --mode=node
            - --endpoint=unix:///csi/csi.sock
            - --node-id=$(NODE_ID)
            - --v=2
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9808
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: pods-mount-dir
              mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/drive.unifi.iperka.com
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: pods-mount-dir
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
